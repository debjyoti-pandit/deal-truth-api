services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: deal_truth
      POSTGRES_PASSWORD: deal_truth
      POSTGRES_DB: deal_truth
    ports:
      - "5432:5432"
    volumes:
      # Fresh volume: old postgres_data was initialized as OpenGong (role opengong).
      - postgres_deal_truth:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deal_truth"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    command: "server -s3 -s3.port=8333 -dir=/data -filer -master.volumeSizeLimitMB=100"
    ports:
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"
    volumes:
      - seaweed_data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://deal_truth:deal_truth@postgres:5432/deal_truth
      DATABASE_SYNC_URL: postgresql+psycopg://deal_truth:deal_truth@postgres:5432/deal_truth
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://deal_truth:deal_truth@postgres:5432/deal_truth
      DATABASE_SYNC_URL: postgresql+psycopg://deal_truth:deal_truth@postgres:5432/deal_truth
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      S3_ENDPOINT_URL: http://seaweedfs:8333
      NGROK_API_URL: http://ngrok:4040
      NGROK_ENABLED: ${NGROK_ENABLED:-true}
      ML_SERVICE_BASE_URL: ${ML_SERVICE_BASE_URL:-http://host.docker.internal:8081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ngrok:
    image: ngrok/ngrok:3
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/ngrok-entrypoint.sh"]
    volumes:
      - ./scripts/ngrok-entrypoint.sh:/ngrok-entrypoint.sh:ro
      - ./scripts/ngrok.yml:/ngrok.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-${NGROK_AUTH_TOKEN:-}}
      NGROK_AUTH_TOKEN: ${NGROK_AUTH_TOKEN:-}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
      NGROK_UPSTREAM: ${NGROK_UPSTREAM:-http://host.docker.internal:8000}
    ports:
      - "4040:4040"

  worker:
    build: .
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://deal_truth:deal_truth@postgres:5432/deal_truth
      DATABASE_SYNC_URL: postgresql+psycopg://deal_truth:deal_truth@postgres:5432/deal_truth
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      S3_ENDPOINT_URL: http://seaweedfs:8333
      NGROK_API_URL: http://ngrok:4040
      NGROK_ENABLED: ${NGROK_ENABLED:-true}
      ML_SERVICE_BASE_URL: ${ML_SERVICE_BASE_URL:-http://host.docker.internal:8081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

volumes:
  postgres_deal_truth:
  redis_data:
  seaweed_data:
